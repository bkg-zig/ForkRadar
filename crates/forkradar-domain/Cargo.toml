[package]
name = "forkradar-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# The web client compiles this crate for WebAssembly. There `uuid` needs a
# randomness source, because the `v4` feature generates UUIDs. The `js` feature
# takes the randomness from the browser and is only enabled for that target, so
# the server build keeps no WebAssembly dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

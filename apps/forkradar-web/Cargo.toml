[package]
name = "forkradar-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "forkradar-web"
path = "src/main.rs"

[dependencies]
forkradar-domain = { workspace = true }
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "MouseEvent",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }

[dependencies.dioxus]
version = "0.7.10"
default-features = false
features = ["web", "lib", "launch"]
